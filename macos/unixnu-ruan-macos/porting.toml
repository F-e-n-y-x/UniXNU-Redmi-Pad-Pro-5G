schema_version = 1

[device]
name = "ruan"
soc = "SM7435"
os_profile = "ipados-17.7.11-21H461"
summary = "Xiaomi Redmi Pad Pro 5G (SM7435 Parrot, no PAC) on iPadOS 17.7.11 (arm64). Draft: kernel/payload inputs only, no device boot yet."

[[area]]
id = "configuration"
status = "planned"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "configs/**", ".gitmodules", ".github/**", ".gitignore"]
inputs = ["ruan live DT (/sys/firmware/fdt, 2026-11-13), vildangil/UniXNU-sm7435-common cf85220, UniXNU ipados-17.7.11-21H461 profile."]
configuration = ["board.toml: soc SM7435, os_profile ipados-17.7.11-21H461 (arm64, no PAC), components ArmDTPlatform ArmCpu SoftwareAES GopFramebuffer XnuPrelink DarwinBoot; configs/ruan_defconfig."]
procedure = ["./unixnu defconfig ruan_defconfig -D ../UniXNU-ruan", "./unixnu fetch", "./unixnu status", "python3 scripts/porting-record.py check --device ../UniXNU-ruan"]
findings = ["Collect the first configuration observation, its cause when established, and the resulting implementation decision."]
completion = ["All source pins resolve; every selected component has a record; status shows the intended overrides and patch order."]
limits = ["Not built or booted on ruan yet."]
next_action = ["Build the kernel on the Linux toolchain and record the result."]
evidence = []

